<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌宠遥控定时组件 · 芽团</title><style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#e8eee6;color:#193a30;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 35% 98% at 91% 51%,transparent 53%,#91aa8f65 56%,#f8fff0 66%,#a6bc98 70%,transparent 73%),radial-gradient(ellipse 60% 106% at -12% 30%,#fafcf4 44%,#bcc7aa 47%,transparent 54%)}main{isolation:isolate;position:relative;width:min(100%,390px);padding:20px 16px 22px;border-radius:38px;background:linear-gradient(150deg,#fafcf3,#e4ede0 75%,#f3f4e9);box-shadow:0 32px 80px #314d362b,inset 0 0 0 1px #fff;margin:18px 0;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;margin:0 8px}h1{font-size:16px;letter-spacing:.02em;font-weight:650}header small{font-size:11px;border:1px solid #a7baa7;padding:4px 8px;border-radius:16px;color:#496251}.scene{position:relative;overflow:hidden;isolation:isolate;height:245px;margin:8px 0 -34px;border-radius:25px 25px 0 0;background:radial-gradient(ellipse at 72% 23%,#feffe2,#daeac5 55%,#bbd5ba);box-shadow:inset 0 1px 0 #ffffffd9}.scene:before,.scene:after{content:"";position:absolute;width:140%;height:145%;border:1px solid #f7fff7a8;border-radius:50%;left:-14%;top:30%;transform:rotate(-19deg)}.scene:after{top:43%;left:-37%}.pet{position:absolute;bottom:-19px;left:19%;width:65%;height:174px;border-radius:54% 57% 31% 38% / 65% 71% 28% 32%;background:radial-gradient(ellipse at 69% 21%,#eaffca,transparent 48%),linear-gradient(126deg,#a2e9c0,#6fc6a5 59%,#429f87);box-shadow:inset -10px -12px 22px #418e7940,inset 3px 6px 9px #dcffdc9c;transform:rotate(-7deg);transition:transform .45s}.pet:before{content:"";position:absolute;left:57%;top:-23px;width:45px;height:40px;background:linear-gradient(125deg,#78c89d,#dcf4b9);border-radius:95% 8% 85% 12%;transform:rotate(-12deg)}.eyes{position:absolute;left:26%;top:24%;display:flex;gap:1px;transform:rotate(7deg)}.eye{width:46px;height:51px;display:grid;place-items:center;background:#fffff5;border-radius:50%;box-shadow:0 2px 4px #59937729}.eye:last-child{margin-top:7px}.eye:after{content:"";width:23px;height:27px;background:#142d28;border-radius:50%;transform:translate(0,7px);transition:transform .32s}.scene{--sun:0;--dew:0}.sun,.dew{position:absolute;transition:opacity .4s;z-index:1}.sun{opacity:var(--sun);right:17%;top:23px;width:29px;height:29px;background:#fff1a4;border-radius:50%;box-shadow:0 0 38px 14px #ffffab}.dew{opacity:var(--dew);left:19%;top:39px;width:18px;height:18px;border-radius:80% 0 65% 65%;background:#68bad0;transform:rotate(-45deg)}.light{--sun:1}.water{--dew:1}.light .eye:after{transform:translate(7px,-6px)}.water .eye:after{transform:translate(-7px,-4px)}.light .pet,.water .pet{transform:translateY(-5px) rotate(-2deg)}
.panel{position:relative;padding:19px 12px 10px;background:linear-gradient(135deg,#ffffffd9,#eff6ebd9);backdrop-filter:blur(16px);border:1px solid #fff;border-radius:26px;box-shadow:0 7px 20px #47704412}.overview{padding:0 6px 14px;display:flex;align-items:center;justify-content:space-between}.overview strong{font-size:22px;letter-spacing:-.04em}.overview span,.muted{color:#4f695a;font-size:12px}.device{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:14px 9px;background:#fff7;border-radius:17px;margin-bottom:6px;transition:background .25s,color .25s}.device.on{background:#28583f;color:white}.icon{font-size:26px;text-align:center;color:#576f40}.on .icon,.on .state{color:#d8efcf}.device h2{font-size:17px;margin:0}.state{font-size:12px;color:#546d5c;font-variant-numeric:tabular-nums}button,input,select{font:inherit;color:inherit}button{border:0;cursor:pointer;min-height:44px;border-radius:16px;padding:0 13px;background:#e1ead7;color:#284e36;font-weight:620}button:active{transform:scale(.96)}button:focus-visible,input:focus-visible{outline:3px solid #58895e}.on button{background:#eff8e3}.plan{width:100%;display:flex;align-items:center;gap:10px;background:transparent;justify-content:space-between;padding:4px 10px}.plan span{margin-left:auto;font-size:12px;font-weight:400}.bottom{padding:15px 7px 0;display:flex;justify-content:space-between;color:#536a5a;font-size:12px}dialog{border:1px solid white;border-radius:28px 28px 16px 16px;width:min(390px,100%);padding:20px;background:#f6faf0f5;color:#203c2e;backdrop-filter:blur(18px);margin:auto auto max(12px,calc((100svh - 600px)/2));box-shadow:0 15px 50px #23452c22}dialog::backdrop{background:#172e2545}dialog h2{margin:0;font-size:22px}dialog header{margin:0}.tabs{display:flex;gap:4px;background:#e2e9dc;border-radius:14px;padding:3px;margin:12px 0}.tabs button{flex:1;background:transparent}.tabs button[aria-pressed=true]{background:white}.dial{margin:10px auto;display:grid;place-content:center;text-align:center;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#f7faf2 61%,transparent 63%),conic-gradient(from 225deg,#72ae80,#2d6c4b 70%,#d6e1d2 70%);font-size:26px}.dial small{font-size:11px}label{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid #dce5d9}input{background:white;border:1px solid #bbcbbb;border-radius:9px;padding:6px;width:115px}input[type=checkbox]{width:20px;height:20px;accent-color:#386846}.save{width:100%;margin-top:15px;background:#28583f;color:white}@media(max-width:460px){body{display:block;background:#edf2e8}body:before{display:none}main{width:100%;min-height:100svh;margin:0;border-radius:0;padding-top:max(16px,env(safe-area-inset-top))}.scene{height:clamp(210px,33svh,285px)}dialog{margin:auto auto 0;border-radius:25px 25px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom))}}@keyframes peek{from{transform:translateY(46px) rotate(-15deg)}to{transform:rotate(-7deg)}}.pet{animation:peek .65s ease-out both}.light .pet,.water .pet{animation:none}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
@keyframes secondEye{0%,32%{transform:translateY(35px) scaleY(.15);opacity:0}85%,100%{transform:none;opacity:1}}.eye:last-child{animation:secondEye .72s both}.device:nth-child(2) .icon{font-size:0}.device:nth-child(2) .icon:after{content:"";display:inline-block;width:14px;height:18px;border:2px solid currentColor;border-radius:80% 10% 65% 65%;transform:rotate(-32deg)}@media(prefers-reduced-motion:reduce){.eye:last-child{animation:none}}@keyframes drifting{50%{translate:5px 12px}}@keyframes following{50%{translate:2px 4px}}.water .dew{animation:drifting 2.4s ease-in-out infinite}.water .eye:after{animation:following 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.water .dew,.water .eye:after{animation:none}}</style><main><header><h1>桌宠遥控定时组件</h1></header><div class="scene" aria-hidden="true"><i class="sun"></i><i class="dew"></i><div class="pet"><div class="eyes"><i class="eye"></i><i class="eye"></i></div></div></div><section class="panel"><div class="overview"><strong>设备控制</strong><span id="summary"></span></div><div id="devices"></div><button class="plan" id="plan">每日计划<span id="count"></span> ›</button></section></main>
<dialog id="sheet"><form id="form"><header><h2>每日计划</h2><button type="button" id="close" aria-label="关闭">关闭</button></header><div class="tabs"><button type="button">补光</button><button type="button">浇水</button></div><label>开始时间<input id="start" type="time" required></label><label>运行时长（分钟）<input id="minutes" type="number" required min="1" max="1439"></label><label>启用每日计划<input id="enabled" type="checkbox"></label><button class="save">保存计划</button></form></dialog>
<script>
const $=id=>document.getElementById(id),names=['补光','浇水'],icons=['☀','♢'],end=[0,0],fired=['',''],rows=[],tabs=[...document.querySelectorAll('.tabs button')];let active=0, plans=names.map(()=>({time:'08:00',mins:1,on:false}));
let state=null, busy=false,online=false;
async function api(path,data){
 const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),3500);
 try{const r=await fetch(path,{method:data?'POST':'GET',cache:'no-store',signal:ac.signal,headers:data?{'Content-Type':'application/json','X-Demo-Token':'__TOKEN__'}:{},body:data?JSON.stringify(data):undefined});
 if(!r.ok)throw Error();return await r.json()}finally{clearTimeout(timer)}
}
function lock(){for(const r of rows)r.querySelector('button').disabled=!online||busy;$('plan').disabled=!online||busy;document.querySelector('.save').disabled=!online||busy}
async function update(path,data){
 if(busy)return false;busy=true;lock();
 try{state=await api(path,data);if(state.wall==null){const now=new Date();state=await api('/clock',{wall:Math.floor(now/1000)-now.getTimezoneOffset()*60})}
 plans=state.cfg.map(c=>({time:[Math.floor(c.start/60),c.start%60].map(n=>String(n).padStart(2,'0')).join(':'),mins:c.minutes,on:c.enabled}));
 online=true;tick();return true}
 catch{online=false;$('summary').textContent='连接中断，请重新连接热点并刷新';rows.forEach(r=>r.querySelector('.state').textContent='状态未知');return false}
 finally{busy=false;lock()}
}
function tick(){let n=0;rows.forEach((r,i)=>{const c=plans[i],left=state.left[i];const label=state.cfg[i].name;const display=['通道一','通道二'][i]===label?names[i]:label;r.querySelector('h2').textContent=display;tabs[i].textContent=display;if(left)n++;r.classList.toggle('on',!!left);r.querySelector('.state').textContent=left?'运行中 · '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'待机';const b=r.querySelector('button');b.textContent=left?'停止':'运行 '+c.mins+' 分钟';b.setAttribute('aria-label',names[i]+' '+b.textContent);document.querySelector('.scene').classList.toggle(i?'water':'light',!!left)});$('summary').textContent=n?n+' 路运行中':'两路待机';$('count').textContent=plans.filter(c=>c.on).length+' 项启用'}
names.forEach((name,i)=>{const r=document.createElement('article');r.className='device';r.innerHTML='<span class="icon" aria-hidden="true">'+icons[i]+'</span><div><h2>'+name+'</h2><span class="state"></span></div><button></button>';r.querySelector('button').onclick=()=>{update(state.reason[i]?'/stop':'/run',{id:i})};$('devices').append(r);rows.push(r)});
function select(i){active=i;const c=plans[i];$('start').value=c.time;$('minutes').value=c.mins;$('enabled').checked=c.on;tabs.forEach((b,k)=>b.setAttribute('aria-pressed',String(i===k)))}
tabs.forEach((b,i)=>b.onclick=()=>select(i));$('plan').onclick=()=>{select(active);$('sheet').showModal()};$('close').onclick=()=>$('sheet').close();$('form').onsubmit=async e=>{e.preventDefault();const [h,m]=$('start').value.split(':').map(Number);const ok=await update('/config',{id:active,name:state.cfg[active].name,start:h*60+m,minutes:Number($('minutes').value),enabled:$('enabled').checked});if(ok)$('sheet').close()};lock();update('/status');setInterval(()=>update('/status'),1200);
</script></html>
